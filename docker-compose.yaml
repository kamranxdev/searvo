services:
  searxng:
    build:
      context: .
      dockerfile: searxng.dockerfile
    container_name: searvo-searxng
    environment:
      - SEARXNG_BOTDETECTION_ENABLED=false
    networks:
      - searvo-network
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: caddy.dockerfile
    container_name: searvo-caddy
    ports:
      - 4000:8080
    networks:
      - searvo-network
    depends_on:
      - searxng
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: searvo_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - searvo-network
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: searvo-api
    ports:
      - "8000:8000"
    environment:
      - SEARXNG_URL=http://searxng:8080
      - QDRANT_URL=http://qdrant:6333
      - PORT=8000
      - HOST=0.0.0.0
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - searvo-network
    depends_on:
      - searxng
      - qdrant
    restart: unless-stopped

networks:
  searvo-network:

volumes:
  qdrant_data: 
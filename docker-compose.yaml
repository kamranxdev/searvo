services:
  searxng:
    build:
      context: .
      dockerfile: searxng.dockerfile
    container_name: searvo-searxng
    environment:
      - SEARXNG_BOTDETECTION_ENABLED=false
    networks:
      - searvo-network
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: caddy.dockerfile
    container_name: searvo-caddy
    ports:
      - 4000:8080
    networks:
      - searvo-network
    depends_on:
      - searxng
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: searvo_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - searvo-network
    restart: unless-stopped

networks:
  searvo-network: 